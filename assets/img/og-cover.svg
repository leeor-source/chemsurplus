  <text x="90" y="430" font-family="Inter, sans-serif" font-size="30" fill="#c8d6d1">Buy &amp; sell verified surplus 30&#8211;70% below market.</text>
  <g transform="translate(90,476)" font-family="Inter, sans-serif" font-size="24" fill="#9fb3ad">
