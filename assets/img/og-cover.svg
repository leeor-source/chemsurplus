    <path d="M25 15h14M27 15v11l-10 18a3 3 0 0 0 2.6 4.6h22.8A3 3 0 0 0 49 44L39 26V15" stroke="#16c79a" stroke-width="3.2" stroke-linejoin="round" fill="none"/>
