<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f1b"/><stop offset="1" stop-color="#0a4a40"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16c79a"/><stop offset="1" stop-color="#0e6b5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- molecular accent -->
  <g stroke="#16c79a" stroke-width="3" opacity=".4">
    <line x1="820" y1="120" x2="930" y2="95"/><line x1="930" y1="95" x2="1030" y2="150"/>
    <line x1="930" y1="95" x2="915" y2="200"/><line x1="1030" y1="150" x2="1060" y2="250"/>
  </g>
  <g fill="#16c79a" opacity=".85">
    <circle cx="820" cy="120" r="10"/><circle cx="930" cy="95" r="13"/><circle cx="1030" cy="150" r="11"/>
    <circle cx="915" cy="200" r="9"/><circle cx="1060" cy="250" r="10"/>
  </g>
  <!-- drums -->
  <g transform="translate(840,300)">
    <rect x="0" y="0" width="120" height="200" rx="16" fill="url(#drum)"/>
    <rect x="0" y="40" width="120" height="8" fill="#fff" opacity=".3"/>
    <rect x="0" y="152" width="120" height="8" fill="#fff" opacity=".3"/>
  </g>
  <g transform="translate(980,350)">
