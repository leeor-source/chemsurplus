# ChemSurplus — nginx config for a VPS (e.g. Ubuntu droplet).
# 1) Copy the site to /var/www/chemsurplus
# 2) Put this at /etc/nginx/sites-available/chemsurplus and symlink to sites-enabled
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS:  sudo certbot --nginx -d chemsurplus.com -d www.chemsurplus.com

server {
    listen 80;
    listen [::]:80;
    server_name chemsurplus.com www.chemsurplus.com;

    root /var/www/chemsurplus;
    index index.html;

    # security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 256;

    # long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
